services:
  vision_foundation_models:
    build:
      context: .
      dockerfile: Dockerfile
    image: vision_foundation_models:latest
    container_name: vision_foundation_models_dev
    stdin_open: true
    tty: true
    ipc: host
    shm_size: '8gb'
    volumes:
      # Mount workspace directory into /workspace inside container
      - ./workspace:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    working_dir: /workspace