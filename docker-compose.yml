services:
  vision_foundation_models:
    build:
      context: .
      dockerfile: Dockerfile
    image: vision_foundation_models:latest
    container_name: vision_foundation_models_dev
    stdin_open: true  # Keeps container interactive (-i)
    tty: true         # Allocates pseudo-TTY (-t)
    working_dir: /workspace
    shm_size: '8g'    # Prevents PyTorch DataLoader OOM crashes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Mount host directories into the container for persistence
      - ./workspace/data:/workspace/datasets
      - ./workspace/models:/workspace/models
      - ./workspace/notebooks:/workspace/notebooks
      - ./workspace/projects:/workspace/projects
    environment:
      - MODEL_DIR=/workspace/models
      - DATASET_DIR=/workspace/datasets
      - PYTHONPATH=/workspace/projects:/workspace/projects/clip_dinoiser:/workspace/projects/sam3:/workspace/projects/GroundingDINO:/workspace/projects/Grounded-Segment-Anything